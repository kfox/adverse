version: 2
updates:
  # The only supply chain this repository actually has. Every workflow pins its
  # actions to a full commit SHA with the tag in a trailing comment; Dependabot
  # reads the comment, bumps the SHA, and rewrites the comment — which is the
  # whole reason SHA pinning is affordable to maintain by hand.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"

  # The package has no runtime or dev dependencies today, and keeping it that
  # way is deliberate: it is spawned as a subprocess by a coding agent, so every
  # dependency is one the agent's environment has to resolve. This entry costs
  # nothing while the tree is empty and starts working the day it is not.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
